name: Auto Deploy Backend to VPS (via Cloudflare Tunnel)

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via Cloudflare Tunnel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Unit Tests
        run: go test ./...

      - name: Install Cloudflared CLI
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Setup SSH Key & Cloudflare Tunnel Config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          cat << EOF > ~/.ssh/config
          Host $VPS_HOST
              User $VPS_USER
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Execute Deployment Commands via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_HOST << 'EOF'
            set -e
            cd /home/firlan/finance-app
            git pull origin backend
            cd /home/firlan/docker
            docker compose up -d finance-migrate
            docker compose up -d --build finance-app
          EOF
